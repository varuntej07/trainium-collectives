[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainium-collectives"
version = "0.1.0"
description = "An explainable cost model for collective communication on Trainium-class, two-tier networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Varun Tej" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/varuntej07/trainium-collectives"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
